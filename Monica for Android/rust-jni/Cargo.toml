[package]
name = "monica-rust-jni"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "GPL-3.0-only"
description = "Android JNI bridge for Monica runtime and cryptographic cores"

# Keep standalone Android builds independent of a parent checkout's Cargo workspace.
[workspace]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
monica-rust-crypto = { path = "../rust-crypto" }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
monica-lan-sync = { path = "../rust-lan-sync" }
