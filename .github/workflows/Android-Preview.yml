name: Android Preview Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Monica for Android/**/*.kt'
      - 'Monica for Android/**/*.java'
      - 'Monica for Android/**/*.xml'
      - 'Monica for Android/**/*.gradle'
      - 'Monica for Android/**/*.kts'
      - 'Monica for Android/gradle/**'
      - 'Monica for Android/rust-core/**'
      - 'Monica for Android/rust-jni/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Monica for Android/**/*.kt'
      - 'Monica for Android/**/*.java'
      - 'Monica for Android/**/*.xml'
      - 'Monica for Android/**/*.gradle'
      - 'Monica for Android/**/*.kts'
      - 'Monica for Android/gradle/**'
      - 'Monica for Android/rust-core/**'
      - 'Monica for Android/rust-jni/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-preview-release
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build & Publish Preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Monica for Android"

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('Monica for Android/**/*.gradle*', 'Monica for Android/**/gradle-wrapper.properties') }}

      - name: Set up Rust Android toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build Rust JNI for preview ABIs
        shell: bash
        run: |
          (
            cd rust-jni
            cargo ndk \
              -t arm64-v8a \
              -t armeabi-v7a \
              -o ../app/src/main/jniLibs \
              build --release
          )
          test -f app/src/main/jniLibs/arm64-v8a/libmonica_rust_jni.so
          test -f app/src/main/jniLibs/armeabi-v7a/libmonica_rust_jni.so

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate signing secrets
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          missing=0
          for name in DEBUG_KEYSTORE_BASE64 DEBUG_STORE_PASSWORD DEBUG_KEY_ALIAS DEBUG_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing signing secret::$name is empty or unavailable."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}

      - name: Decode keystore
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          printf '%s' "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          if [ ! -s "$GITHUB_WORKSPACE/release.jks" ]; then
            echo "::error title=Keystore decode failed::release.jks was not created or is empty."
            exit 1
          fi
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Verify keystore credentials
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/release.jks" \
            -storepass "${{ secrets.DEBUG_STORE_PASSWORD }}" \
            -alias "${{ secrets.DEBUG_KEY_ALIAS }}" >/dev/null
          echo "Keystore, password, and alias validated successfully."
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Generate preview version suffix
        id: preview_meta
        shell: bash
        run: |
          suffix="build.$(date -u +%Y%m%d%H%M)"
          echo "PREVIEW_VERSION_SUFFIX=$suffix" >> "$GITHUB_ENV"
          echo "preview_version_suffix=$suffix" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK for PR validation
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleDebug --stacktrace -PpreviewVersionSuffix=$PREVIEW_VERSION_SUFFIX

      - name: Build unsigned Release APK for PR size validation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --stop
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            -Pkotlin.incremental=false \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PpreviewVersionSuffix=$PREVIEW_VERSION_SUFFIX \
            2>&1 | tee "$RUNNER_TEMP/preview-build.log"

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --stop
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            -Pkotlin.incremental=false \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.DEBUG_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.DEBUG_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.DEBUG_KEY_PASSWORD }} \
            -PpreviewVersionSuffix=$PREVIEW_VERSION_SUFFIX \
            2>&1 | tee "$RUNNER_TEMP/preview-build.log"
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Verify Rust JNI is packaged
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk -type f -iname '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error title=APK verification failed::No APK was generated."
            exit 1
          fi

          arm64_found=0
          armv7_found=0
          for apk in "${apks[@]}"; do
            entries="$(unzip -Z1 "$apk")"
            grep -qx 'lib/arm64-v8a/libmonica_rust_jni.so' <<< "$entries" && arm64_found=1
            grep -qx 'lib/armeabi-v7a/libmonica_rust_jni.so' <<< "$entries" && armv7_found=1
          done

          test "$arm64_found" -eq 1 || {
            echo "::error title=Rust JNI missing::arm64-v8a library was not packaged."
            exit 1
          }
          test "$armv7_found" -eq 1 || {
            echo "::error title=Rust JNI missing::armeabi-v7a library was not packaged."
            exit 1
          }

      - name: Collect APK size report
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/apk-size-report.txt"
          : > "$report"
          mapfile -t apks < <(find app/build/outputs/apk -type f -iname '*.apk' | sort)

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No APK generated." | tee -a "$report"
            exit 0
          fi

          for apk in "${apks[@]}"; do
            bytes="$(stat -c '%s' "$apk")"
            mib="$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }')"
            sha="$(sha256sum "$apk" | awk '{print $1}')"
            {
              echo "============================================================"
              echo "APK: $apk"
              echo "Bytes: $bytes"
              echo "MiB: $mib"
              echo "SHA-256: $sha"
              echo "Largest 30 uncompressed ZIP entries:"
              unzip -l "$apk" \
                | awk 'NR > 3 && $1 ~ /^[0-9]+$/ && NF >= 4 { print $1 "\t" $4 }' \
                | sort -nr \
                | awk 'NR <= 30'
              echo
            } | tee -a "$report"
          done

          echo "APK size report written to $report"

      - name: Upload APK size report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk-size-report
          path: ${{ runner.temp }}/apk-size-report.txt
          if-no-files-found: error

      - name: Upload PR unsigned Release APKs
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr-unsigned-release-apks
          path: Monica for Android/app/build/outputs/apk/release/*.APK
          if-no-files-found: error

      - name: Upload preview build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-build-log
          path: ${{ runner.temp }}/preview-build.log
          if-no-files-found: ignore

      - name: Collect generated APK metadata
        id: preview_apk_meta
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          cd app/build/outputs/apk/release

          apk_list="$(find . -maxdepth 1 -type f \( -iname '*.apk' \) -printf '%f\n' | sort)"
          apk_count="$(printf '%s\n' "$apk_list" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [ "$apk_count" = "0" ]; then
            echo "No release APK found"
            ls -la
            exit 1
          fi

          apk_markdown="$(printf '%s\n' "$apk_list" | sed '/^$/d' | sed 's/^/> *   `/; s/$/`/')"

          echo "Detected release APKs:"
          printf '%s\n' "$apk_list" | sed '/^$/d' | sed 's/^/ - /'
          echo "PREVIEW_APK_COUNT=${apk_count}" >> "$GITHUB_ENV"
          echo "preview_apk_count=${apk_count}" >> "$GITHUB_OUTPUT"
          {
            echo "preview_apk_list<<EOF"
            printf '%s\n' "$apk_markdown"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Move preview tag to current commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa preview ${{ github.sha }} -m "Development Preview"
          git push origin refs/tags/preview --force

      - name: Cleanup duplicate preview draft releases
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          draft_ids=$(gh api repos/${{ github.repository }}/releases --paginate --jq '.[] | select(.tag_name == "preview" and .draft == true) | .id')
          if [ -z "$draft_ids" ]; then
            echo "No duplicate preview draft releases to clean"
            exit 0
          fi

          while IFS= read -r release_id; do
            [ -z "$release_id" ] && continue
            echo "Deleting duplicate preview draft release id=${release_id}"
            gh api -X DELETE repos/${{ github.repository }}/releases/${release_id}
          done <<< "$draft_ids"

      - name: Cleanup previous preview release assets
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          release_id="$(gh api repos/${{ github.repository }}/releases/tags/preview --jq '.id' 2>/dev/null || true)"
          if [ -z "$release_id" ]; then
            echo "No existing preview release assets to clean"
            exit 0
          fi

          asset_ids="$(gh api repos/${{ github.repository }}/releases/${release_id}/assets --paginate --jq '.[].id')"
          if [ -z "$asset_ids" ]; then
            echo "Preview release has no existing assets"
            exit 0
          fi

          while IFS= read -r asset_id; do
            [ -z "$asset_id" ] && continue
            echo "Deleting previous preview asset id=${asset_id}"
            gh api -X DELETE repos/${{ github.repository }}/releases/assets/${asset_id}
          done <<< "$asset_ids"

      - name: Publish Preview to Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          target_commitish: ${{ github.sha }}
          name: "⚠️ Development Preview (${{ steps.preview_meta.outputs.preview_version_suffix }})"
          body: |
            > **⚠️ 注意：这是一个自动构建的开发预览版本 (Development Preview)**
            >
            > 此版本用于快速体验最新代码，可能包含未完成的功能或 Bug。
            > 正式使用请下载下面的 Stable 版本。
            > 但是实际上 Stable 版本可能不如这个预览版本更新，毕竟 Stable 版本需要经过更多的测试和验证。
            > 预览版本可能会更快地包含最新的功能和修复，但也可能更不稳定。
            > ---
            > **构建信息：**
            > *   **Build Suffix**: `${{ steps.preview_meta.outputs.preview_version_suffix }}`
            > *   **Generated APK Count**: `${{ steps.preview_apk_meta.outputs.preview_apk_count }}`
            > **Generated APKs:**
            ${{ steps.preview_apk_meta.outputs.preview_apk_list }}
            > *   **Commit SHA**: `${{ github.sha }}`
            > *   **Ref**: `${{ github.ref }}`
          files: |
            Monica for Android/app/build/outputs/apk/release/*.APK
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
